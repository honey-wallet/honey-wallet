packages:
  - apps/*
  - packages/*
  - deck

# Shared versions for tooling used by several packages. Reference with "catalog:".
catalog:
  typescript: ~6.0.3
  vitest: ^5.0.5

# Only allow dependency install scripts we have reviewed.
onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
  - turbo

overrides:
  # Keep Expo's consumers on fixed releases without changing the SDK.
  query-string>decode-uri-component: 0.5.1
  node-forge: 1.4.3
  # @expo/fingerprint 0.20.15 asks for minimatch ^10 and glob ^13 (ReDoS, AbortSignal
  # advisories); it only uses Minimatch and glob(), unchanged in the copies Expo's CLI uses.
  minimatch@>=7 <11.0.1: 11.0.5
  glob@>=9 <14.0.2: 14.0.4
  # Firebase pulls in Firestore's gRPC client; the app never uses Firestore.
  '@grpc/grpc-js': ^1.13.6
  # abitype (via WalletConnect/ox) validates untrusted typed data with zod; <4.6.6 can
  # exhaust memory on crafted input.
  zod@<4.6.6: ^4.6.6
  # One WalletConnect stack in the app bundle: WalletKit 1.6.0 pins 2.25.0 while the app
  # (and its native compat module) is on 2.26.0, which bundled both. JS only.
  '@walletconnect/core': 2.26.0
  '@walletconnect/sign-client': 2.26.0
  '@walletconnect/types': 2.26.0
  '@walletconnect/utils': 2.26.0
  # Same-major copies of the noble crypto libs collapse to one (semver-compatible).
  '@noble/curves@1': 1.9.7
  '@noble/hashes@1': 1.8.0

patchedDependencies:
  # braces has no fixed release (see auditConfig below). decode-uri-component is ESM-only,
  # which breaks query-string 7, so its patch restores the CommonJS export.
  braces@3.0.3: patches/braces@3.0.3.patch
  decode-uri-component@0.5.1: patches/decode-uri-component@0.5.1.patch
  expo-alternate-app-icons@8.0.0: patches/expo-alternate-app-icons@8.0.0.patch
  # The web build (Honey for Chrome): Keyframe entrances were left pinned with
  # position:absolute after they finished, shifting text (see the patch).
  react-native-reanimated@4.5.1: patches/react-native-reanimated@4.5.1.patch

auditConfig:
  # Fixed by the local braces patch above (no upstream release yet). Build tooling
  # (Metro), not code that ships in the app. Drop once braces > 3.0.3 is released.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces: deeply nested pattern stack exhaustion
